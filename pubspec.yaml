name: committee_pay_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.1.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # UI & Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Forms & Inputs
  flutter_svg: ^2.0.10
  country_picker: ^2.0.21
  phone_numbers_parser: ^8.0.0

  # Images & Files
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Local Storage
  shared_preferences: ^2.3.0

  # Connectivity
  connectivity_plus: ^6.0.2

  printing: ^5.12.0
  fluttertoast: ^9.0.0
  # Others
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  uuid: ^4.3.3
  package_info_plus: ^8.0.0
  share_plus: ^12.0.1
  flutter_fortune_wheel: ^1.0.0
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#21A472"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#21A472"
  image: assets/images/app_icon.png
  android: true
  ios: true
  fullscreen: true
